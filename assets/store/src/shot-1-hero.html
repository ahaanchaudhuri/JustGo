<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>hero</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1280px; height: 800px; overflow: hidden; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
        background-color: #0B0D10;
        background-image: radial-gradient(rgba(148, 163, 184, 0.09) 1px, transparent 1px);
        background-size: 22px 22px;
        color: #E9ECF0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 52px;
        -webkit-font-smoothing: antialiased;
        position: relative;
    }
    .glow {
        position: absolute;
        top: -260px;
        left: 50%;
        transform: translateX(-50%);
        width: 1100px;
        height: 560px;
        background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.14), transparent 65%);
    }
    .headline {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    h1 {
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -1.8px;
    }
    h1 em {
        font-style: normal;
        color: #38BDF8;
    }
    .sub {
        font-size: 22px;
        color: #9AA3AF;
        letter-spacing: -0.3px;
    }
    /* mock browser omnibox */
    .browser {
        width: 860px;
        background: #14171C;
        border: 1px solid #242A33;
        border-radius: 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        overflow: hidden;
    }
    .chrome-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px;
        border-bottom: 1px solid #242A33;
        background: #101318;
    }
    .dots { display: flex; gap: 7px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #333B47; }
    .omnibox {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #1B2027;
        border: 1px solid rgba(56, 189, 248, 0.55);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
        border-radius: 999px;
        padding: 11px 20px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 17px;
    }
    .keyword {
        background: rgba(56, 189, 248, 0.14);
        color: #38BDF8;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 14px;
    }
    .typed { color: #E9ECF0; }
    .caret {
        width: 2px;
        height: 20px;
        background: #38BDF8;
    }
    .suggestions { padding: 10px; }
    .suggestion {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 16px;
        border-radius: 10px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 15.5px;
    }
    .suggestion.active {
        background: rgba(56, 189, 248, 0.12);
    }
    .s-name { color: #E9ECF0; font-weight: 700; min-width: 120px; }
    .suggestion.active .s-name { color: #38BDF8; }
    .s-dash { color: #636C79; }
    .s-url { color: #9AA3AF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .suggestion.active .s-url { color: #7DD3FC; }
</style>
</head>
<body>
    <div class="glow"></div>
    <div class="headline">
        <h1>Type a name. <em>Land on the page.</em></h1>
        <div class="sub">Your own URL shortcuts, right in the address bar — local and private.</div>
    </div>
    <div class="browser">
        <div class="chrome-bar">
            <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="omnibox">
                <span class="keyword">JustGo</span>
                <span class="typed">gh claude</span>
                <div class="caret"></div>
            </div>
        </div>
        <div class="suggestions">
            <div class="suggestion active">
                <span class="s-name">gh</span>
                <span class="s-dash">—</span>
                <span class="s-url">https://github.com/search?q=claude</span>
            </div>
            <div class="suggestion">
                <span class="s-name">gh-issues</span>
                <span class="s-dash">—</span>
                <span class="s-url">https://github.com/issues</span>
            </div>
            <div class="suggestion">
                <span class="s-name">mail</span>
                <span class="s-dash">—</span>
                <span class="s-url">https://mail.google.com</span>
            </div>
        </div>
    </div>
</body>
</html>
